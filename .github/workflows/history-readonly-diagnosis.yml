name: Consulta protegida de histórico
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/legacy-outcome-audit.php.stub
      - scripts/component-unification-query.php.stub
      - scripts/technical-grades-query.php.stub
      - scripts/technical-enrollment-review.php.stub
      - scripts/diary-workload-audit-query.php.stub
      - scripts/diary-progress-query.php.stub
      - app/Support/LegacyLiceuItineraryLinks.php
      - scripts/liceu-itinerary-query.php.stub
      - scripts/diary-batch-query.php.stub
      - scripts/student-reenrollment-query.php.stub
      - scripts/history-issuance-query.php.stub
      - scripts/class-diary-reconciliation-query.php.stub
      - scripts/student-transfer-grades-query.php.stub
      - scripts/student-workload-query.php.stub
      - scripts/high-school-diversified-query.php.stub
      - scripts/history-catalog-classification-query.php.stub
      - scripts/history-readonly-diagnosis.php.stub
      - scripts/history-readonly-diagnosis.py
      - scripts/history-diagnosis-target.enc
      - scripts/history-report-public.pem
      - scripts/history-query.json
      - .github/workflows/history-readonly-diagnosis.yml
permissions:
  contents: write
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install 'paramiko==3.5.1'
      - name: Consultar em transação somente de leitura
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          HOSTINGER_CONNECTION: ${{ secrets.HOSTINGER_CONNECTION }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: python scripts/history-readonly-diagnosis.py
      - name: Guardar apenas o relatório criptografado em branch de consulta
        env:
          DIAGNOSIS_RUN_ID: ${{ github.run_id }}
          DIAGNOSIS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blob=$(git hash-object -w history-diagnosis.encrypted.json)
          tree=$(printf '100644 blob %s\treport.json\n' "$blob" | git mktree)
          commit=$(printf 'relatório de consulta criptografado\n' | git commit-tree "$tree")
          report_branch="consulta-historico-${DIAGNOSIS_RUN_ID}-${DIAGNOSIS_RUN_ATTEMPT}"
          git push origin "$commit:refs/heads/$report_branch"
          printf 'Relatório criptografado: `%s`\n' "$report_branch" >> "$GITHUB_STEP_SUMMARY"
