name: Conferência da modalidade do Lar
on:
  push:
    branches: [codex/conferencia-modalidade-lar]
    paths: [.github/workflows/conferencia-modalidade-lar.yml, scripts/lar-field-education*]
permissions:
  contents: write
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install 'paramiko==3.5.1'
      - name: Corrigir e conferir as 11 matrizes do Lar
        env:
          HOSTINGER_CONNECTION: ${{ secrets.HOSTINGER_CONNECTION }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: python scripts/lar-field-education.py
      - name: Guardar somente o relatório criptografado
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blob=$(git hash-object -w educacao-do-campo.encrypted.json)
          tree=$(printf '100644 blob %s\treport.json\n' "$blob" | git mktree)
          commit=$(printf 'relatório de atos escolares criptografado\n' | git commit-tree "$tree")
          git push origin "$commit:refs/heads/consulta-modalidade-lar-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
