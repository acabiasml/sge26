name: Consulta protegida dos atos escolares
on:
  push:
    branches: [codex/consulta-atos-escolas]
    paths: [.github/workflows/consulta-atos-escolas.yml, scripts/authorized-school-query*]
permissions:
  contents: write
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install 'paramiko==3.5.1'
      - name: Consultar os campos de atos e as modalidades em transação de leitura
        env:
          HOSTINGER_CONNECTION: ${{ secrets.HOSTINGER_CONNECTION }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: python scripts/authorized-school-query.py
      - name: Guardar somente o relatório criptografado
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blob=$(git hash-object -w atos-escolas.encrypted.json)
          tree=$(printf '100644 blob %s\treport.json\n' "$blob" | git mktree)
          commit=$(printf 'relatório de atos escolares criptografado\n' | git commit-tree "$tree")
          git push origin "$commit:refs/heads/consulta-atos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
