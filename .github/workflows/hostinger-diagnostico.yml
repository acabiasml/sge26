name: Diagnóstico Hostinger
on:
  workflow_dispatch:
    inputs:
      refresh_views:
        description: Limpar cache das telas Blade
        type: boolean
        default: false
      apply_visibility_migration:
        description: Aplicar somente a migration de visibilidade dos documentos oficiais
        type: boolean
        default: false
      apply_private_owner_migration:
        description: Aplicar somente a migration de proprietário dos documentos privados
        type: boolean
        default: false
      apply_reclassification_migration:
        description: Aplicar somente a migration de resultados das matrículas reclassificadas
        type: boolean
        default: false
      apply_social_name_cleanup:
        description: Limpar os nomes sociais já cadastrados e conferir o total restante
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hostinger-diagnostico
  cancel-in-progress: false
jobs:
  verificar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Preparar cliente SSH
        run: python -m pip install 'paramiko==3.5.1'
      - name: Verificar produção e aplicar migration quando solicitado
        env:
          REFRESH_VIEWS: ${{ inputs.refresh_views }}
          APPLY_VISIBILITY_MIGRATION: ${{ inputs.apply_visibility_migration }}
          APPLY_PRIVATE_OWNER_MIGRATION: ${{ inputs.apply_private_owner_migration }}
          APPLY_RECLASSIFICATION_MIGRATION: ${{ inputs.apply_reclassification_migration }}
          APPLY_SOCIAL_NAME_CLEANUP: ${{ inputs.apply_social_name_cleanup }}
          EXPECTED_COMMIT: ${{ github.sha }}
          HOSTINGER_CONNECTION: ${{ secrets.HOSTINGER_CONNECTION }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: python scripts/hostinger-diagnostico.py
      - name: Verificar resposta HTTP
        run: curl --fail --silent --show-error --location --max-time 30 --output /dev/null https://ctjj.org/sge/
