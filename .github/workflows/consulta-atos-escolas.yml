name: Consulta protegida dos atos escolares
on:
  push:
    branches: [codex/consulta-atos-escolas]
    paths: [.github/workflows/consulta-atos-escolas.yml, scripts/authorized-school-query*]
permissions:
  contents: read
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install 'paramiko==3.5.1'
      - name: Consultar os campos de atos e as modalidades em transação de leitura
        env:
          HOSTINGER_CONNECTION: ${{ secrets.HOSTINGER_CONNECTION }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: python scripts/authorized-school-query.py
      - uses: actions/upload-artifact@v4
        with:
          name: atos-escolas-criptografados
          path: atos-escolas.encrypted.json
          retention-days: 1
