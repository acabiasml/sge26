name: Diagnóstico Hostinger
on:
  workflow_dispatch:
    inputs:
      refresh_views:
        description: Limpar cache das telas Blade
        type: boolean
        default: false
      apply_visibility_migration:
        description: Aplicar somente a migration de visibilidade dos documentos oficiais
        type: boolean
        default: false
      apply_private_owner_migration:
        description: Aplicar somente a migration de proprietário dos documentos privados
        type: boolean
        default: false
      apply_reclassification_migration:
        description: Aplicar somente a migration de resultados das matrículas reclassificadas
        type: boolean
        default: false
      apply_social_name_cleanup:
        description: Limpar os nomes sociais já cadastrados e conferir o total restante
        type: boolean
        default: false
      apply_attendance_justification_migration:
        description: Aplicar somente a migration de histórico das justificativas de ausência
        type: boolean
        default: false
      apply_role_view_migration:
        description: Aplicar somente a migration de preferência da visão do sistema
        type: boolean
        default: false
      apply_history_grade_migration:
        description: Aplicar somente a migration de identificação dos anos do histórico escolar
        type: boolean
        default: false
      invalidate_all_sessions:
        description: Desconectar todos os usuários e invalidar tokens antigos de login
        type: boolean
        default: false
      inspect_enrollment:
        description: ID da matrícula para conferir o resultado e os critérios sem alterar dados
        type: string
        default: ''
      correct_2025_criteria:
        description: Aplicar correção confirmada de 2025 da matrícula 486 (22,5 pontos e 2 dependências)
        type: boolean
        default: false
      pending_year_for_enrollment:
        description: Matrícula que identifica o ano para consulta dos resultados pendentes
        type: string
        default: ''
      report_public_key:
        description: Chave pública temporária em base64 para criptografar o relatório restrito
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: hostinger-diagnostico
  cancel-in-progress: false
jobs:
  verificar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Preparar cliente SSH
        run: python -m pip install 'paramiko==3.5.1'
      - name: Verificar produção e aplicar migration quando solicitado
        env:
          REFRESH_VIEWS: ${{ inputs.refresh_views }}
          APPLY_VISIBILITY_MIGRATION: ${{ inputs.apply_visibility_migration }}
          APPLY_PRIVATE_OWNER_MIGRATION: ${{ inputs.apply_private_owner_migration }}
          APPLY_RECLASSIFICATION_MIGRATION: ${{ inputs.apply_reclassification_migration }}
          APPLY_SOCIAL_NAME_CLEANUP: ${{ inputs.apply_social_name_cleanup }}
          APPLY_ATTENDANCE_JUSTIFICATION_MIGRATION: ${{ inputs.apply_attendance_justification_migration }}
          APPLY_ROLE_VIEW_MIGRATION: ${{ inputs.apply_role_view_migration }}
          APPLY_HISTORY_GRADE_MIGRATION: ${{ inputs.apply_history_grade_migration }}
          INVALIDATE_ALL_SESSIONS: ${{ inputs.invalidate_all_sessions }}
          INSPECT_ENROLLMENT: ${{ inputs.inspect_enrollment }}
          CORRECT_2025_CRITERIA: ${{ inputs.correct_2025_criteria }}
          PENDING_YEAR_FOR_ENROLLMENT: ${{ inputs.pending_year_for_enrollment }}
          REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
          EXPECTED_COMMIT: ${{ github.sha }}
          HOSTINGER_CONNECTION: ${{ secrets.HOSTINGER_CONNECTION }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: python scripts/hostinger-diagnostico.py
      - name: Disponibilizar relatório criptografado
        if: inputs.pending_year_for_enrollment != ''
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pendentes-criptografados
          path: pending-results.encrypted.json
          retention-days: 1
          if-no-files-found: error
      - name: Verificar resposta HTTP
        run: curl --fail --silent --show-error --location --max-time 30 --output /dev/null https://ctjj.org/sge/
