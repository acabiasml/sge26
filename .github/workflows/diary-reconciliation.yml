name: Reconciliação protegida de diários documentados
on:
  push:
    branches: [main]
    paths:
      - scripts/diary-reconciliation.json
      - scripts/diary-reconciliation.encrypted.json
      - scripts/run-diary-reconciliation.py
      - scripts/run-diary-reconciliation.php.stub
      - app/Support/LegacyClassDiaryReconciler.php
      - app/Support/DocumentedDiaryImporter.php
      - app/Support/TechnicalGradeCompleter.php
      - app/Support/LegacyDiaryBatchReconciler.php
      - app/Support/LegacyEnrollmentEpisodeRestorer.php
      - app/Support/SchoolYearClassHourCorrection.php
      - .github/workflows/diary-reconciliation.yml
permissions:
  contents: write
concurrency:
  group: diary-reconciliation
  cancel-in-progress: false
jobs:
  reconciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install 'paramiko==3.5.1'
      - name: Conferir alvo e executar o modo autorizado
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          HOSTINGER_CONNECTION: ${{ secrets.HOSTINGER_CONNECTION }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: python scripts/run-diary-reconciliation.py
      - name: Guardar somente o relatório criptografado
        if: always()
        env:
          RECONCILIATION_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -f diary-reconciliation-report.encrypted.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blob=$(git hash-object -w diary-reconciliation-report.encrypted.json)
          tree=$(printf '100644 blob %s\treport.json\n' "$blob" | git mktree)
          commit=$(printf 'relatório privado de reconciliação\n' | git commit-tree "$tree")
          git push origin "$commit:refs/heads/reconciliacao-diarios-$RECONCILIATION_RUN_ID"
